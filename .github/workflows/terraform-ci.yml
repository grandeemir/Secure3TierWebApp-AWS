name: Terraform CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      health_check_url:
        description: "Optional live HTTPS endpoint to smoke-test (leave empty to skip)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    name: Terraform format, init, validate and lint
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: environments/DEV
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
          cache: true

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint all Terraform directories
        run: tflint --recursive --format compact

      - name: Optional live HTTPS health check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.health_check_url != '' }}
        env:
          HEALTH_CHECK_URL: ${{ inputs.health_check_url }}
        run: |
          set -euo pipefail
          if [[ ! "$HEALTH_CHECK_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^[:space:]]*)?$ ]]; then
            echo "Health-check URL must be an HTTPS URL with a valid hostname."
            exit 1
          fi
          echo "Checking HTTPS endpoint: $HEALTH_CHECK_URL"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-connrefused \
            --max-time 20 "$HEALTH_CHECK_URL" --output /dev/null
          echo "Endpoint returned a successful HTTP response."

  security-checks:
    name: Infrastructure security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy Terraform/IaC misconfiguration scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
